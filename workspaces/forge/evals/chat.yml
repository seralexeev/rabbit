- id: battery_average
  anchor: |
    WITH (SELECT run_id FROM runs WHERE stopped_at IS NOT NULL ORDER BY duration_s DESC LIMIT 1) AS r
    SELECT r AS run, avg(battery_voltage) AS v,
      concat('(', replace(toDecimalString(floor(v, 1), 1), '.', '[.,]'), '|', replace(toDecimalString(ceil(v, 1), 1), '.', '[.,]'), ')') AS v_re
    FROM power WHERE run_id = r
  question: What was the average battery voltage in run {run}?
  all: [run_slab]
  facts: ["{v_re}"]
- id: english_only
  anchor: |
    WITH (SELECT run_id FROM runs WHERE stopped_at IS NOT NULL ORDER BY duration_s DESC LIMIT 1) AS r
    SELECT r AS run, avg(battery_voltage) AS v,
