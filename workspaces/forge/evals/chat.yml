- id: last_relocalization
  anchor: |
    SELECT concat(formatDateTime(ts, '%H:%i', 'UTC'), '|', replaceRegexpOne(formatDateTime(ts, '%H:%i', 'Australia/Sydney'), '^0', '0?')) AS at_re
    FROM logs WHERE node = 'rabbit-zed' AND message LIKE 'Relocalized%'
    ORDER BY ts DESC LIMIT 1
  question: When did the camera last relocalize in its saved map?
  any:
    [
