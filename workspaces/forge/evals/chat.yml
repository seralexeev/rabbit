- id: stall
  anchor: &peak |
    SELECT run_id,
      concat(formatDateTime(ts, '%H:%i', 'UTC'), '|', replaceRegexpOne(formatDateTime(ts, '%H:%i', 'Australia/Sydney'), '^0', '0?')) AS at_re,
      formatDateTime(ts, '%H:%i', 'UTC') AS at_utc,
      formatDateTime(ts - INTERVAL 2 MINUTE, '%Y-%m-%d %H:%i:%S', 'UTC') AS window_from,
      formatDateTime(ts + INTERVAL 2 MINUTE, '%Y-%m-%d %H:%i:%S', 'UTC') AS window_to
    FROM roboclaw
    WHERE greatest(abs(left_pwm), abs(right_pwm)) > 0.05
    ORDER BY abs(left_current) + abs(right_current) DESC LIMIT 1
  question: Did the motors stall or spike in run {run_id}?
  all: ["run_slab:stall_events"]
  facts: ["{at_re}"]
- id: motor_anomaly_window
  anchor: *peak
  question: Was anything unusual with the motor current in run {run_id} between {window_from} and {window_to} UTC?
  all: ["detect_anomalies:motor_current"]
  facts: ["{at_re}"]
- id: multi_metric_anomaly
  anchor: *peak
  question: Did battery voltage and motor current misbehave together between {window_from} and {window_to} UTC in run {run_id}?
  all: ["detect_anomalies:battery_voltage", "detect_anomalies:motor_current"]
  facts: ["{at_re}"]
- id: spike_cause
  anchor: *peak
  question: Why did the motor current spike around {at_utc} UTC in run {run_id}?
  any:
    [
      "investigate:motor_current",
      "detect_anomalies:motor_current",
      "run_slab:stall_events",
    ]
  facts: ["command|throttle|drive|pwm|stall|inrush|start|obstacle|wall"]
- id: data_gaps
  anchor: &gap |
    SELECT run_id,
      concat(formatDateTime(prev, '%H:%i', 'UTC'), '|', replaceRegexpOne(formatDateTime(prev, '%H:%i', 'Australia/Sydney'), '^0', '0?')) AS at_re,
      formatDateTime(prev, '%H:%i', 'UTC') AS at_utc
    FROM (
      SELECT run_id, ts, lagInFrame(ts, 1, ts) OVER (PARTITION BY run_id ORDER BY ts ROWS BETWEEN 1 PRECEDING AND CURRENT ROW) AS prev
      FROM power
    )
    ORDER BY ts - prev DESC LIMIT 1
  question: Were there data gaps or reboots in run {run_id}?
  all: ["run_slab:brownout_and_gaps"]
  facts: ["{at_re}"]
- id: investigate_gap
  anchor: *gap
  question: Investigate the data gap at {at_utc} UTC in run {run_id}
  all: ["investigate:data_gaps"]
  facts: ["TL;DR", "`ref:", "`next:"]
