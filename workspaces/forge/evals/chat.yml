- id: who_stopped
  anchor: |
    SELECT formatDateTime(ts, '%H:%i:%S', 'UTC') AS at_utc, formatDateTime(ts, '%Y-%m-%d', 'UTC') AS day,
      if(source = 'hud', 'HUD|hud|operator', 'Forge|forge|chat') AS who_re
    FROM drive WHERE speed = 0 AND source IN ('hud', 'forge') ORDER BY ts DESC LIMIT 1
  question: Who sent the stop command at {at_utc} UTC on {day}?
  any: [timeline, "run_slab:command_timeline"]
  facts: ["{who_re}"]
- id: recent_exploration
  anchor: |
    SELECT arrayStringConcat(arraySlice(splitByChar(' ', argMax(message, ts)), 1, 2), ' ') AS message,
      replaceRegexpOne(replace(toDecimalString(max(travelled_m), 1), '.', '[.,]'), '\\[\\.,\\]0$', '([.,]0)?') AS metres_re
    FROM explore_state
    WHERE exploration_id = (
      SELECT exploration_id FROM explore_state WHERE exploration_id != ''
      GROUP BY exploration_id ORDER BY min(ts) DESC LIMIT 1
    )
  question: How did the most recent exploration go?
  all: ["run_slab:explorations"]
  facts: ["{message}", "{metres_re}"]
- id: fridge_trip
