- id: rare_object
  anchor: |
    WITH greatest(
      ifNull((SELECT max(ts) FROM logs WHERE node = 'rabbit-zed' AND (message LIKE 'Archived%' OR message LIKE 'Restarting the camera process: map reset%')), toDateTime64(0, 9, 'UTC')),
      ifNull((SELECT max(ts) FROM command_events WHERE subject = 'rabbit.map.reset'), toDateTime64(0, 9, 'UTC'))
    ) AS epoch
    SELECT label FROM objects WHERE ts > epoch AND confidence >= 40
    GROUP BY label HAVING count() BETWEEN 3 AND 9 AND max(confidence) >= 55 ORDER BY count() LIMIT 1
  question: Where is the {label}?
  all: [find_object]
  facts:
    [
      "brief|few|once|twice|rare|only|uncertain|\\d+ (times|frames|detections|sightings)",
    ]
  none: [go_to, run_mission]
- id: object_from_old_map
  anchor: |
    WITH greatest(
      ifNull((SELECT max(ts) FROM logs WHERE node = 'rabbit-zed' AND (message LIKE 'Archived%' OR message LIKE 'Restarting the camera process: map reset%')), toDateTime64(0, 9, 'UTC')),
      ifNull((SELECT max(ts) FROM command_events WHERE subject = 'rabbit.map.reset'), toDateTime64(0, 9, 'UTC'))
    ) AS epoch
    SELECT label FROM objects GROUP BY label
    HAVING countIf(ts > epoch) = 0 AND countIf(confidence >= 55) >= 10
    ORDER BY count() DESC LIMIT 1
  question: Where is the {label}?
  all: [find_object]
  facts: ["not|n['’]t|no |never|haven"]
  none: [go_to, run_mission]
