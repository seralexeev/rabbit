name: forge

services:
  forge:
    build: .
    image: forge
    container_name: forge
    restart: unless-stopped
    init: true
    command: ["serve", "--writer"]
    stop_grace_period: 45s
    env_file: .env
    environment:
      FORGE_CHAT_LISTEN_HOST: 0.0.0.0
      FORGE_DATA_DIR: /app/data
      FORGE_LOG_CONSUMER: forge-mac
      FORGE_SYNC_FROM: ""
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./src:/app/src:ro
      - ./slabs:/app/slabs:ro
      - ./graph:/app/graph:ro
      - data:/app/data
      - ./dead_letters:/app/dead_letters
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18080/api/health').then((r) => r.json()).then((h) => process.exit(h.clickhouse ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  data:
