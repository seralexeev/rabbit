map $http_origin $chat_origin {
    "" https://jetson.rabbit;
    default $http_origin;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jetson.rabbit;

    ssl_certificate /etc/cert/cert.pem;
    ssl_certificate_key /etc/cert/key.pem;

    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $chat http://forge-chat:18080;
        proxy_pass $chat;
        proxy_set_header Host localhost:18080;
        proxy_set_header Origin $chat_origin;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
