map $cookie_rabbit_link $link_name {
    include /etc/nginx/links/links.map;
}

map "$http_cf_connecting_ip|$link_name|$uri" $link_denied {
    "~^[^|]+\|\|(?!/k/)" 1;
    default 0;
}

log_format links '$remote_addr "$http_cf_connecting_ip" link=$link_name [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/cert/cert.pem;
    ssl_certificate_key /etc/cert/key.pem;

    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log links;
    default_type text/html;
    absolute_redirect off;

    if ($link_denied) {
        return 403 "<!doctype html><title>Rabbit</title><body style=\"background:#000;color:#ccc;font:16px monospace;display:grid;place-items:center;height:100vh;margin:0\">This link is not active.</body>";
    }

    location ~ "^/k/([0-9a-f]{32})$" {
        add_header Set-Cookie "rabbit_link=$1; Path=/; Max-Age=31536000; HttpOnly; Secure; SameSite=Lax";
        return 302 /;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /nats {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nats https://nats:9222;
        proxy_pass $nats;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        client_max_body_size 64m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $chat http://forge-chat:18080;
        proxy_pass $chat;
        proxy_set_header Host localhost:18080;
        proxy_set_header Origin https://jetson.rabbit;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
