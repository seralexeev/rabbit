x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '3'

services:
  nats:
    logging: *logging
    image: nats:latest
    container_name: nats
    command: -c /etc/nats/nats-server.conf
    volumes:
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./nats/data:/data/nats
      - ../cert:/etc/cert:ro
    restart: unless-stopped
    ports:
      - '4222:4222'
      - '9222:9222'
      - '8222:8222'

  nats-init:
    logging: *logging
    image: bitnami/natscli
    depends_on:
      - nats
    volumes:
      - ./nats/init.sh:/init.sh
    entrypoint: ['/bin/bash', '/init.sh']
    restart: 'no'

  rabbit-zed:
    logging: *logging
    build:
      context: ./rabbit
      dockerfile: ./docker/Dockerfile.zed
    container_name: rabbit-zed
    stop_grace_period: 30s
    privileged: true
    working_dir: /rabbit
    runtime: nvidia
    volumes:
      - ./rabbit:/rabbit
      - /dev:/dev
      - /tmp/argus_socket:/tmp/argus_socket
      - ../../zed/settings:/usr/local/zed/settings
      - ../../zed/resources:/usr/local/zed/resources
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    restart: unless-stopped
    command: uv run src/node/zed.py
    depends_on:
      - nats-init

  rabbit-roboclaw:
    logging: *logging
    build:
      context: ./rabbit
      dockerfile: ./docker/Dockerfile.zed
    container_name: rabbit-roboclaw
    privileged: true
    working_dir: /rabbit
    volumes:
      - ./rabbit:/rabbit
      - /dev:/dev
    restart: unless-stopped
    command: uv run src/node/roboclaw.py

  rabbit-steering:
    logging: *logging
    build:
      context: ./rabbit
      dockerfile: ./docker/Dockerfile.zed
    container_name: rabbit-steering
    privileged: true
    working_dir: /rabbit
    volumes:
      - ./rabbit:/rabbit
    restart: unless-stopped
    command: uv run src/node/steering.py

  rabbit-nav:
    logging: *logging
    build:
      context: ./rabbit
      dockerfile: ./docker/Dockerfile.zed
    container_name: rabbit-nav
    working_dir: /rabbit
    volumes:
      - ./rabbit:/rabbit
    restart: unless-stopped
    command: uv run src/node/nav.py
    depends_on:
      - nats-init

  rabbit-explore:
    logging: *logging
    build:
      context: ./rabbit
      dockerfile: ./docker/Dockerfile.zed
    container_name: rabbit-explore
    working_dir: /rabbit
    volumes:
      - ./rabbit:/rabbit
    restart: unless-stopped
    command: uv run src/node/explore.py
    depends_on:
      - nats-init

  rabbit-telemetry:
    logging: *logging
    build:
      context: ./rabbit
      dockerfile: ./docker/Dockerfile.zed
    container_name: rabbit-telemetry
    privileged: true
    network_mode: host
    environment:
      - NATS_URL=nats://127.0.0.1:4222
      - WIFI_INTERFACE=wlP1p1s0
    working_dir: /rabbit
    volumes:
      - ./rabbit:/rabbit
      - /run/jtop.sock:/run/jtop.sock
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    command: uv run src/node/telemetry.py
    depends_on:
      - nats-init

  rabbit-ina:
    logging: *logging
    build:
      context: ./rabbit
      dockerfile: ./docker/Dockerfile.zed
    container_name: rabbit-ina
    privileged: true
    working_dir: /rabbit
    volumes:
      - ./rabbit:/rabbit
    restart: unless-stopped
    command: uv run src/node/ina.py
    depends_on:
      - nats-init

  forge-clickhouse:
    logging: *logging
    image: clickhouse/clickhouse-server:26.1-alpine
    container_name: forge-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: forge
    volumes:
      - forge-clickhouse:/var/lib/clickhouse
      - ./forge/clickhouse/config.xml:/etc/clickhouse-server/config.d/forge.xml:ro
      - ./forge/clickhouse/users.xml:/etc/clickhouse-server/users.d/forge.xml:ro
    mem_limit: 900m
    cpus: 1.5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8123/ping']
      interval: 2s
      timeout: 3s
      retries: 60

  forge-writer:
    logging: *logging
    build: ./forge
    image: forge
    container_name: forge-writer
    restart: unless-stopped
    init: true
    command: ['writer']
    stop_grace_period: 45s
    env_file: ./forge/.env
    environment:
      FORGE_CLICKHOUSE_URL: http://forge-clickhouse:8123
      FORGE_NATS_URL: nats://nats:4222
    volumes:
      - forge-dead-letters:/app/dead_letters
    mem_limit: 512m
    cpus: 1
    depends_on:
      forge-clickhouse:
        condition: service_healthy
      nats-init:
        condition: service_started

  forge-chat:
    logging: *logging
    image: forge
    pull_policy: never
    container_name: forge-chat
    restart: unless-stopped
    init: true
    command: ['serve']
    env_file: ./forge/.env
    environment:
      FORGE_CLICKHOUSE_URL: http://forge-clickhouse:8123
      FORGE_NATS_URL: nats://nats:4222
      FORGE_CHAT_LISTEN_HOST: 0.0.0.0
    mem_limit: 384m
    cpus: 1
    depends_on:
      forge-writer:
        condition: service_started

  rabbit-web:
    logging: *logging
    image: nginx:1.29-alpine
    container_name: rabbit-web
    restart: unless-stopped
    ports:
      - '443:443'
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../cert:/etc/cert:ro
    mem_limit: 64m
    depends_on:
      - forge-chat

  nats-dashboard:
    logging: *logging
    image: mdawar/nats-dashboard
    container_name: nats-dashboard
    environment:
      - NATS_URL=nats://nats:4222
    ports:
      - '8000:80'
    depends_on:
      - nats

volumes:
  forge-clickhouse:
  forge-dead-letters:
