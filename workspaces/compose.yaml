x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '3'

x-rabbit: &rabbit
  logging: *logging
  image: rabbit
  pull_policy: never
  working_dir: /rabbit
  restart: unless-stopped
  volumes:
    - &rabbit-src ./rabbit:/rabbit
  depends_on:
    - nats-init

x-forge: &forge
  logging: *logging
  image: forge
  restart: unless-stopped
  init: true
  env_file: ./forge/.env
  environment:
    FORGE_CLICKHOUSE_URL: http://forge-clickhouse:8123
    FORGE_NATS_URL: nats://nats:4222
  volumes:
    - &forge-src ./forge/src:/app/src:ro
    - &forge-clickhouse-config ./forge/clickhouse:/app/clickhouse:ro
    - &forge-slabs ./forge/slabs:/app/slabs:ro
    - &forge-graph ./forge/graph:/app/graph:ro
  cpus: 1

services:
  nats:
    logging: *logging
    image: nats:latest
    container_name: nats
    command: -c /etc/nats/nats-server.conf
    volumes:
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./nats/data:/data/nats
      - ../cert:/etc/cert:ro
    restart: unless-stopped
    ports:
      - '4222:4222'
      - '9222:9222'
      - '8222:8222'

  nats-init:
    logging: *logging
    image: bitnami/natscli
    depends_on:
      - nats
    volumes:
      - ./nats/init.sh:/init.sh
    entrypoint: ['/bin/bash', '/init.sh']
    restart: 'no'

  rabbit-zed:
    <<: *rabbit
    build:
      context: ./rabbit
      dockerfile: ./docker/Dockerfile.zed
    pull_policy: build
    container_name: rabbit-zed
    stop_grace_period: 30s
    privileged: true
    runtime: nvidia
    volumes:
      - *rabbit-src
      - /dev:/dev
      - ../../zed/settings:/usr/local/zed/settings
      - ../../zed/resources:/usr/local/zed/resources
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    command: ['sh', '-c', 'uv sync --quiet && exec .venv/bin/python src/node/zed.py']

  rabbit-roboclaw:
    <<: *rabbit
    container_name: rabbit-roboclaw
    privileged: true
    volumes:
      - *rabbit-src
      - /dev:/dev
    command: ['sh', '-c', 'uv sync --quiet && exec .venv/bin/python src/node/roboclaw.py']

  rabbit-steering:
    <<: *rabbit
    container_name: rabbit-steering
    privileged: true
    command: ['sh', '-c', 'uv sync --quiet && exec .venv/bin/python src/node/steering.py']

  rabbit-nav:
    <<: *rabbit
    container_name: rabbit-nav
    command: ['sh', '-c', 'uv sync --quiet && exec .venv/bin/python src/node/nav.py']

  rabbit-loc:
    <<: *rabbit
    image: rabbit-loc
    container_name: rabbit-loc
    profiles: ['loc']
    mem_limit: 512m
    cpus: 1
    command: ['python', 'src/node/loc.py']

  rabbit-explore:
    <<: *rabbit
    container_name: rabbit-explore
    command: ['sh', '-c', 'uv sync --quiet && exec .venv/bin/python src/node/explore.py']

  rabbit-planner:
    <<: *rabbit
    container_name: rabbit-planner
    command: ['sh', '-c', 'uv sync --quiet && exec .venv/bin/python src/node/planner.py']

  rabbit-telemetry:
    <<: *rabbit
    container_name: rabbit-telemetry
    privileged: true
    network_mode: host
    environment:
      - NATS_URL=nats://127.0.0.1:4222
      - WIFI_INTERFACE=wlP1p1s0
    volumes:
      - *rabbit-src
      - /run/jtop.sock:/run/jtop.sock
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/kernel/debug:/sys/kernel/debug:ro
    command: ['sh', '-c', 'uv sync --quiet && exec .venv/bin/python src/node/telemetry.py']

  rabbit-ina:
    <<: *rabbit
    container_name: rabbit-ina
    privileged: true
    command: ['sh', '-c', 'uv sync --quiet && exec .venv/bin/python src/node/ina.py']

  forge-clickhouse:
    logging: *logging
    image: clickhouse/clickhouse-server:26.1-alpine
    container_name: forge-clickhouse
    restart: unless-stopped
    ports:
      - '18123:8123'
    environment:
      CLICKHOUSE_DB: forge
    volumes:
      - forge-clickhouse:/var/lib/clickhouse
      - ./forge/clickhouse/config.xml:/etc/clickhouse-server/config.d/forge.xml:ro
      - ./forge/clickhouse/users.xml:/etc/clickhouse-server/users.d/forge.xml:ro
    mem_limit: 900m
    cpus: 1
    cpu_shares: 256
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8123/ping']
      interval: 2s
      timeout: 3s
      retries: 60

  forge-writer:
    <<: *forge
    build: ./forge
    container_name: forge-writer
    command: ['writer']
    stop_grace_period: 45s
    volumes:
      - *forge-src
      - *forge-clickhouse-config
      - *forge-slabs
      - *forge-graph
      - forge-dead-letters:/app/dead_letters
    mem_limit: 512m
    depends_on:
      forge-clickhouse:
        condition: service_healthy
      nats-init:
        condition: service_started

  forge-chat:
    <<: *forge
    pull_policy: never
    container_name: forge-chat
    command: ['serve']
    environment:
      FORGE_CLICKHOUSE_URL: http://forge-clickhouse:8123
      FORGE_NATS_URL: nats://nats:4222
      FORGE_CHAT_LISTEN_HOST: 0.0.0.0
    mem_limit: 384m
    depends_on:
      forge-writer:
        condition: service_started

  rabbit-web:
    logging: *logging
    image: nginx:1.29-alpine
    container_name: rabbit-web
    restart: unless-stopped
    command: ['nginx', '-g', 'daemon off; worker_shutdown_timeout 5s;']
    ports:
      - '443:443'
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./links:/etc/nginx/links:ro
      - ../cert:/etc/cert:ro
    mem_limit: 64m
    depends_on:
      - forge-chat

  nats-dashboard:
    logging: *logging
    image: mdawar/nats-dashboard
    container_name: nats-dashboard
    environment:
      - NATS_URL=nats://nats:4222
    ports:
      - '8000:80'
    depends_on:
      - nats

  tunnel:
    logging: *logging
    image: cloudflare/cloudflared:2026.9.0
    container_name: tunnel
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', '--protocol', 'http2', 'run']
    env_file: ./tunnel.env
    depends_on:
      - rabbit-web

volumes:
  forge-clickhouse:
  forge-dead-letters:
