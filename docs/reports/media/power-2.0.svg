<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="890" viewBox="0 0 1820 890" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#c0392b"/></marker><marker id="arrc" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1565c0"/></marker></defs><rect width="1820" height="890" fill="white"/><text x="30" y="40" font-size="22" fill="#111" text-anchor="start" font-weight="700">Rabbit 2.0 power distribution (NEEWER PS099E on the V-mount plate)</text><text x="30" y="64" font-size="13" fill="#555" text-anchor="start" font-weight="400">Battery-side currents at 13.2 V (empty pack). typ = driving/idle, peak = worst short spike. Measured today (Forge, 1–3 Oct) or datasheet where marked.</text><rect x="30" y="100" width="220" height="110" rx="8" fill="#fff4e0" stroke="#c27c0e" stroke-width="1.6"/><text x="140.0" y="122" text-anchor="middle" font-size="14" font-weight="700">NEEWER PS099E</text><text x="140.0" y="140" text-anchor="middle" font-size="12" font-weight="400">V-mount, 99 Wh, 4S Li-ion</text><text x="140.0" y="156" text-anchor="middle" font-size="12" font-weight="400">12.4–16.8 V (14.5 V nom.)</text><text x="140.0" y="172" text-anchor="middle" font-size="12" font-weight="400">plate: 14 A max, 100 W rated</text><text x="140.0" y="188" text-anchor="middle" font-size="12" font-weight="400">pass-through charging</text><line x1="250" y1="155" x2="300" y2="155" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="300" y="110" width="170" height="90" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="385.0" y="132" text-anchor="middle" font-size="14" font-weight="700">Main switch</text><text x="385.0" y="150" text-anchor="middle" font-size="12" font-weight="400">Pololu Big HP #2813</text><text x="385.0" y="166" text-anchor="middle" font-size="12" font-weight="400">OFF ← Pi GPIO17</text><text x="385.0" y="182" text-anchor="middle" font-size="12" font-weight="400">+ fuse 15 A, TVS</text><line x1="470" y1="155" x2="520" y2="155" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="520" y="110" width="160" height="90" rx="8" fill="#fde7ef" stroke="#d81b60" stroke-width="1.6"/><text x="600.0" y="132" text-anchor="middle" font-size="14" font-weight="700">Shunt 2 mΩ → INA ch1</text><text x="600.0" y="150" text-anchor="middle" font-size="12" font-weight="400">battery, 41 A range</text><text x="600.0" y="166" text-anchor="middle" font-size="12" font-weight="400">today 10 mΩ = 8.2 A cap!</text><text x="600.0" y="182" text-anchor="middle" font-size="12" font-weight="400">external, Kelvin</text><line x1="680" y1="155" x2="730" y2="155" stroke="#c0392b" stroke-width="3"/><line x1="730" y1="155" x2="730" y2="745" stroke="#c0392b" stroke-width="5"/><text x="740" y="140" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">BAT+ bus 12.4–16.8 V</text><text x="722" y="240" font-size="14" fill="#111" text-anchor="end" font-weight="700">MOTORS</text><line x1="730" y1="235" x2="760" y2="235" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="760" y="200" width="140" height="70" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="830.0" y="222" text-anchor="middle" font-size="13" font-weight="700">Fuse 10 A</text><text x="830.0" y="240" text-anchor="middle" font-size="11" font-weight="400">shunt 5 mΩ → ch3</text><line x1="900" y1="235" x2="930" y2="235" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="930" y="190" width="250" height="92" rx="8" fill="#fdecea" stroke="#3b4a63" stroke-width="1.6"/><text x="1055.0" y="212" text-anchor="middle" font-size="14" font-weight="700">RoboClaw 2x30A</text><text x="1055.0" y="230" text-anchor="middle" font-size="12" font-weight="400">6–34 V, direct from battery</text><text x="1055.0" y="246" text-anchor="middle" font-size="12" font-weight="400">current limit 3 A/ch, max duty 0.71</text><text x="1055.0" y="262" text-anchor="middle" font-size="12" font-weight="400">E-stop input S3 ← Pi</text><line x1="1180" y1="235" x2="1210" y2="235" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="1210" y="190" width="260" height="92" rx="8" fill="#fdecea" stroke="#3b4a63" stroke-width="1.6"/><text x="1340.0" y="212" text-anchor="middle" font-size="14" font-weight="700">2× Pololu 37D 70:1 12 V</text><text x="1340.0" y="230" text-anchor="middle" font-size="12" font-weight="400">free 0.2 A, stall 5.5 A each</text><text x="1340.0" y="246" text-anchor="middle" font-size="12" font-weight="400">+ encoders (to be wired)</text><text x="930" y="302" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">typ 0.3–0.6 A · peak ≤ 4.5 A (limited)</text><text x="722" y="395" font-size="14" fill="#111" text-anchor="end" font-weight="700">STEERING</text><line x1="730" y1="390" x2="760" y2="390" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="760" y="355" width="140" height="70" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="830.0" y="377" text-anchor="middle" font-size="13" font-weight="700">Fuse 7.5 A</text><line x1="900" y1="390" x2="930" y2="390" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="930" y="345" width="250" height="92" rx="8" fill="#eef3fb" stroke="#3b4a63" stroke-width="1.6"/><text x="1055.0" y="367" text-anchor="middle" font-size="14" font-weight="700">Pololu D36V50F6</text><text x="1055.0" y="385" text-anchor="middle" font-size="12" font-weight="400">6 V, 5.5 A buck</text><text x="1055.0" y="401" text-anchor="middle" font-size="12" font-weight="400">out → 10 mΩ ch2 → PCA9685 V+</text><line x1="1180" y1="390" x2="1210" y2="390" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="1210" y="345" width="260" height="92" rx="8" fill="#eef3fb" stroke="#3b4a63" stroke-width="1.6"/><text x="1340.0" y="367" text-anchor="middle" font-size="14" font-weight="700">AGFRC A50BHL</text><text x="1340.0" y="385" text-anchor="middle" font-size="12" font-weight="400">brushless HV servo 4.8–8.4 V</text><text x="1340.0" y="401" text-anchor="middle" font-size="12" font-weight="400">16 kg·cm @ 6 V, stall 4.2 A</text><text x="930" y="457" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">typ 0.02 A · peak 3 A (5.9 A @ 6 V measured)</text><text x="722" y="550" font-size="14" fill="#111" text-anchor="end" font-weight="700">BRAIN</text><line x1="730" y1="545" x2="760" y2="545" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="760" y="510" width="140" height="70" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="830.0" y="532" text-anchor="middle" font-size="13" font-weight="700">Fuse 5 A</text><line x1="900" y1="545" x2="930" y2="545" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="930" y="500" width="250" height="92" rx="8" fill="#f3eefb" stroke="#3b4a63" stroke-width="1.6"/><text x="1055.0" y="522" text-anchor="middle" font-size="14" font-weight="700">Pololu D36V50F12</text><text x="1055.0" y="540" text-anchor="middle" font-size="12" font-weight="400">12 V buck, EN ← Pi GPIO25 (Q1)</text><text x="1055.0" y="556" text-anchor="middle" font-size="12" font-weight="400">out → 10 mΩ ch4 → DC jack</text><line x1="1180" y1="545" x2="1210" y2="545" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="1210" y="500" width="260" height="92" rx="8" fill="#f3eefb" stroke="#3b4a63" stroke-width="1.6"/><text x="1340.0" y="522" text-anchor="middle" font-size="14" font-weight="700">Jetson Orin Nano Super</text><text x="1340.0" y="540" text-anchor="middle" font-size="12" font-weight="400">carrier input 9–20 V</text><text x="1340.0" y="556" text-anchor="middle" font-size="12" font-weight="400">+ ZED 2i (USB, ~2 W)</text><text x="930" y="612" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">typ 1.0 A · peak 1.8 A (module ≤ 15 W)</text><text x="722" y="705" font-size="14" fill="#111" text-anchor="end" font-weight="700">BODY</text><line x1="730" y1="700" x2="760" y2="700" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="760" y="665" width="140" height="70" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="830.0" y="687" text-anchor="middle" font-size="13" font-weight="700">Fuse 5 A</text><line x1="900" y1="700" x2="930" y2="700" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="930" y="655" width="250" height="92" rx="8" fill="#eef7ee" stroke="#3b4a63" stroke-width="1.6"/><text x="1055.0" y="677" text-anchor="middle" font-size="14" font-weight="700">Pololu D24V90F5 (owned)</text><text x="1055.0" y="695" text-anchor="middle" font-size="12" font-weight="400">5 V, 4-8 A buck</text><text x="1055.0" y="711" text-anchor="middle" font-size="12" font-weight="400">short thick leads to Pi</text><line x1="1180" y1="700" x2="1210" y2="700" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/><rect x="1210" y="655" width="260" height="92" rx="8" fill="#eef7ee" stroke="#3b4a63" stroke-width="1.6"/><text x="1340.0" y="677" text-anchor="middle" font-size="14" font-weight="700">Raspberry Pi 4 8 GB (5 V pins)</text><text x="1340.0" y="695" text-anchor="middle" font-size="12" font-weight="400">+ RPLIDAR C1, ToF 3.3 V reg,</text><text x="1340.0" y="711" text-anchor="middle" font-size="12" font-weight="400">fan; USB hub on its own fuse</text><text x="930" y="767" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">typ 0.75 A · peak 1.3 A (5 V side 2–3.5 A)</text><rect x="1500" y="75" width="300" height="785" rx="8" fill="#fff7fa" stroke="#d81b60" stroke-width="1.6"/><text x="1650.0" y="97" text-anchor="middle" font-size="14" font-weight="700">INA4235 (TI INA4235EVM)</text><text x="1650.0" y="115" text-anchor="middle" font-size="12" font-weight="400">I2C 0x41 → Pi I2C1, VS 3.3 V</text><text x="1650.0" y="131" text-anchor="middle" font-size="12" font-weight="400">ALERT → Pi GPIO24 (latched)</text><text x="1650.0" y="147" text-anchor="middle" font-size="12" font-weight="400">shunt range ±81.92 mV</text><rect x="1515" y="160" width="270" height="78" rx="8" fill="#fde7ef" stroke="#d81b60" stroke-width="1.6"/><text x="1650.0" y="182" text-anchor="middle" font-size="12" font-weight="700">ch1 BATTERY</text><text x="1650.0" y="200" text-anchor="middle" font-size="10" font-weight="400">2 mΩ external Kelvin</text><text x="1650.0" y="216" text-anchor="middle" font-size="10" font-weight="400">range 41.0 A, LSB 1.25 mA</text><text x="1650.0" y="232" text-anchor="middle" font-size="10" font-weight="400">alert &lt; 12.8 V, &gt; 13 A</text><path d="M600,110 L600,95 L1490,95 L1490,199 L1515,199" fill="none" stroke="#d81b60" stroke-width="2" stroke-dasharray="2,3"/><rect x="1515" y="281" width="270" height="78" rx="8" fill="#fde7ef" stroke="#d81b60" stroke-width="1.6"/><text x="1650.0" y="303" text-anchor="middle" font-size="12" font-weight="700">ch3 MOTORS</text><text x="1650.0" y="321" text-anchor="middle" font-size="10" font-weight="400">5 mΩ external Kelvin</text><text x="1650.0" y="337" text-anchor="middle" font-size="10" font-weight="400">range 16.4 A, LSB 1 mA</text><text x="1650.0" y="353" text-anchor="middle" font-size="10" font-weight="400">alert &gt; 8 A</text><path d="M830,270 L830,318 L1490,318 L1490,320 L1515,320" fill="none" stroke="#d81b60" stroke-width="2" stroke-dasharray="2,3"/><rect x="1515" y="436" width="270" height="78" rx="8" fill="#fde7ef" stroke="#d81b60" stroke-width="1.6"/><text x="1650.0" y="458" text-anchor="middle" font-size="12" font-weight="700">ch2 SERVO 6 V</text><text x="1650.0" y="476" text-anchor="middle" font-size="10" font-weight="400">10 mΩ on the EVM pad</text><text x="1650.0" y="492" text-anchor="middle" font-size="10" font-weight="400">range 8.19 A (as today)</text><text x="1650.0" y="508" text-anchor="middle" font-size="10" font-weight="400">6 V side: sees servo sag</text><path d="M1200,390 L1200,473 L1490,473 L1490,475 L1515,475" fill="none" stroke="#d81b60" stroke-width="2" stroke-dasharray="2,3"/><rect x="1515" y="591" width="270" height="78" rx="8" fill="#fde7ef" stroke="#d81b60" stroke-width="1.6"/><text x="1650.0" y="613" text-anchor="middle" font-size="12" font-weight="700">ch4 JETSON 12 V</text><text x="1650.0" y="631" text-anchor="middle" font-size="10" font-weight="400">10 mΩ on the EVM pad</text><text x="1650.0" y="647" text-anchor="middle" font-size="10" font-weight="400">range 8.19 A, LSB 1 mA</text><text x="1650.0" y="663" text-anchor="middle" font-size="10" font-weight="400">alert &lt; 11 V (buck limit)</text><path d="M1200,545 L1200,628 L1490,628 L1490,630 L1515,630" fill="none" stroke="#d81b60" stroke-width="2" stroke-dasharray="2,3"/><rect x="1515" y="748" width="270" height="78" rx="8" fill="#f4f4f4" stroke="#999999" stroke-width="1.6"/><text x="1650.0" y="770" text-anchor="middle" font-size="12" font-weight="700">Pi branch: not measured</text><text x="1650.0" y="788" text-anchor="middle" font-size="10" font-weight="400">≈ ch1 minus the others</text><text x="1650.0" y="804" text-anchor="middle" font-size="10" font-weight="400">Pi reports undervoltage</text><text x="1650.0" y="820" text-anchor="middle" font-size="10" font-weight="400">itself (get_throttled)</text><text x="1500" y="880" font-size="12" fill="#d81b60" text-anchor="start" font-weight="400">Dotted: Kelvin sense pairs, AWG26 twisted</text><text x="30" y="300" font-size="15" fill="#1565c0" text-anchor="start" font-weight="700">Control (Pi = body + safety)</text><text x="30" y="326" font-size="13" fill="#223" text-anchor="start" font-weight="400">• power button → Pi: long press = stop motors,</text><text x="30" y="345" font-size="13" fill="#223" text-anchor="start" font-weight="400">  Jetson saves the map and halts, then Pi</text><text x="30" y="364" font-size="13" fill="#223" text-anchor="start" font-weight="400">  halts and pulls the main switch OFF pin</text><text x="30" y="383" font-size="13" fill="#223" text-anchor="start" font-weight="400">• Pi GPIO → Jetson buck EN: power-cycle a hung Jetson</text><text x="30" y="402" font-size="13" fill="#223" text-anchor="start" font-weight="400">• Pi GPIO → RoboClaw S3 E-stop: hardware stop</text><text x="30" y="421" font-size="13" fill="#223" text-anchor="start" font-weight="400">  independent of any software on the Jetson</text><text x="30" y="440" font-size="13" fill="#223" text-anchor="start" font-weight="400">• Pi I2C1: INA4235 + PCA9685; INA ALERT → GPIO24:</text><text x="30" y="459" font-size="13" fill="#223" text-anchor="start" font-weight="400">  12.8 V or overcurrent → stop, orderly shutdown</text><text x="30" y="478" font-size="13" fill="#223" text-anchor="start" font-weight="400">• ground: star point at the fuse block, one return</text><text x="30" y="497" font-size="13" fill="#223" text-anchor="start" font-weight="400">  per branch; motor return never through logic GND</text><text x="30" y="540" font-size="15" fill="#111" text-anchor="start" font-weight="700">Budget at the battery</text><text x="30" y="566" font-size="13" fill="#555" text-anchor="start" font-weight="700"></text><text x="230" y="566" font-size="13" fill="#555" text-anchor="start" font-weight="700">today</text><text x="370" y="566" font-size="13" fill="#555" text-anchor="start" font-weight="700">2.0</text><text x="30" y="587" font-size="13" fill="#111" text-anchor="start" font-weight="400">idle median</text><text x="230" y="587" font-size="13" fill="#111" text-anchor="start" font-weight="400">21.6 W</text><text x="370" y="587" font-size="13" fill="#111" text-anchor="start" font-weight="400">~31 W</text><text x="30" y="608" font-size="13" fill="#111" text-anchor="start" font-weight="400">driving median</text><text x="230" y="608" font-size="13" fill="#111" text-anchor="start" font-weight="400">29.7 W</text><text x="370" y="608" font-size="13" fill="#111" text-anchor="start" font-weight="400">~38 W</text><text x="30" y="629" font-size="13" fill="#111" text-anchor="start" font-weight="400">measured peak</text><text x="230" y="629" font-size="13" fill="#111" text-anchor="start" font-weight="400">104 W / 7.6 A</text><text x="370" y="629" font-size="13" fill="#111" text-anchor="start" font-weight="400">—</text><text x="30" y="650" font-size="13" fill="#111" text-anchor="start" font-weight="400">worst-case sum</text><text x="230" y="650" font-size="13" fill="#111" text-anchor="start" font-weight="400">—</text><text x="370" y="650" font-size="13" fill="#111" text-anchor="start" font-weight="400">~10.4 A (137 W)</text><text x="30" y="671" font-size="13" fill="#111" text-anchor="start" font-weight="400">runtime idle (89 Wh)</text><text x="230" y="671" font-size="13" fill="#111" text-anchor="start" font-weight="400">~4.1 h</text><text x="370" y="671" font-size="13" fill="#111" text-anchor="start" font-weight="400">~2.9 h</text><text x="30" y="692" font-size="13" fill="#111" text-anchor="start" font-weight="400">runtime driving</text><text x="230" y="692" font-size="13" fill="#111" text-anchor="start" font-weight="400">~3.0 h</text><text x="370" y="692" font-size="13" fill="#111" text-anchor="start" font-weight="400">~2.3 h</text><text x="30" y="730" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Plate limit 14 A: OK only with RoboClaw current limits.</text><text x="30" y="750" font-size="13" fill="#c0392b" text-anchor="start" font-weight="400">Without them two stalled motors at 16.8 V draw ~15 A.</text><text x="30" y="790" font-size="13" fill="#223" text-anchor="start" font-weight="400">Wire: AWG16 battery/motors, AWG18 ≤ 30 cm to Jetson,</text><text x="30" y="809" font-size="13" fill="#223" text-anchor="start" font-weight="400">AWG18 to Pi 5 V (Pi undervolts below 4.63 V).</text></svg>